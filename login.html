        <nav class="navbar navbar-expand-lg bg-celeste">

                        <span id="mensajeError" class="text-danger mt-2"></span>

                        <button class="btn btn-primary mt-3" type="submit" id="botonInicioSesion">Iniciar Sesión</button>
